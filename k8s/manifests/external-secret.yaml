apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-secrets
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-secrets # K8s mein is naam ka secret banega
    creationPolicy: Owner
  data:
    - secretKey: mysql-root-password
      remoteRef:
        key: secret/devsecops/creds
        property: db_root_pass
    - secretKey: mysql-database
      remoteRef:
        key: secret/devsecops/creds
        property: database__connection__database
    - secretKey: ARGO_TOKEN
      remoteRef:
        key: secret/devsecops/creds
        property: argo_token
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: secret/devsecops/creds
        property: github_token
    - secretKey: DOCKER_PASS
      remoteRef:
        key: secret/devsecops/creds
        property: docker_pass
    - secretKey: SNYK_TOKEN
      remoteRef:
        key: secret/devsecops/creds
        property: snyk_token
    - secretKey: SONAR_TOKEN
      remoteRef:
        key: secret/devsecops/creds
        property: sonar_token
    - secretKey: NVD_API_KEY
      remoteRef:
        key: secret/devsecops/creds
        property: nvd_api_key
