apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-vault-sync
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-secrets
    template:
      data:
        # Vault mein jo 'db_pass' hai, wo Ghost ke liye 'database__connection__password' ban jayega
        database__connection__password: "{{ .db_pass_from_vault }}"
        database__connection__database: "{{ .db_name_from_vault }}"
        database__client: "mysql"
        database__connection__user: "root"
        database__connection__host: "mysql-service" 
        url: "http://100.24.125.225:30005"
  data:
  - secretKey: db_pass_from_vault
    remoteRef:
      key: devsecops/creds
      property: db_pass # Vault ki purani property
  - secretKey: db_name_from_vault
    remoteRef:
      key: devsecops/creds
      property: db_name # Vault ki purani property
