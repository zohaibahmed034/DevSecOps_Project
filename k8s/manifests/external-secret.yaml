apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-secrets
  namespace: default
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-secrets
    creationPolicy: Owner
  data:
  # 1. Database Engine (Static Roles)
  # We add metadataPolicy: Fetch to tell the operator to look at the raw response
  - secretKey: MYSQL_ROOT_PASSWORD
    remoteRef:
      key: "../../database/static-creds/ghost-root-role"
      property: password
      metadataPolicy: Fetch
  - secretKey: MYSQL_PASSWORD
    remoteRef:
      key: "../../database/static-creds/ghost-app-role"
      property: password
      metadataPolicy: Fetch
  # 2. KV Engine (Metadata)
  - secretKey: MYSQL_DATABASE
    remoteRef:
      key: devsecops/creds
      property: MYSQL_DATABASE
  - secretKey: MYSQL_USER
    remoteRef:
      key: devsecops/creds
      property: MYSQL_USER
