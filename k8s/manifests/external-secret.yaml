apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-app-secrets
  namespace: default
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-secrets # Ye main secret banega
    creationPolicy: Merge
  data:
  # --- Part 1: DATABASE ENGINE (Static Roles) ---
  - secretKey: MYSQL_ROOT_PASSWORD
    remoteRef:
      key: "../../database/static-creds/ghost-root-role"
      property: password
  - secretKey: MYSQL_PASSWORD
    remoteRef:
      key: "../../database/static-creds/ghost-app-role"
      property: password

  # --- Part 2: KV ENGINE (Static Metadata) ---
  - secretKey: MYSQL_DATABASE
    remoteRef:
      key: devsecops/creds
      property: MYSQL_DATABASE
  - secretKey: MYSQL_USER
    remoteRef:
      key: devsecops/creds
      property: MYSQL_USER
  - secretKey: url
    remoteRef:
      key: devsecops/creds
      property: url
