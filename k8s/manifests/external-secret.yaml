apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-secrets
  namespace: default
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-secrets
    creationPolicy: Owner
  data:
  # 1. Database Engine (Static Roles)
  # No "data" wrapper here, so we point directly to the password property
  - secretKey: MYSQL_ROOT_PASSWORD
    remoteRef:
      key: "../../database/static-creds/ghost-root-role"
      property: password
  - secretKey: MYSQL_PASSWORD
    remoteRef:
      key: "../../database/static-creds/ghost-app-role"
      property: password
  # 2. KV Engine (Metadata)
  # The operator knows to look for the "data" field here because it's the default KV path
  - secretKey: MYSQL_DATABASE
    remoteRef:
      key: devsecops/creds
      property: MYSQL_DATABASE
  - secretKey: MYSQL_USER
    remoteRef:
      key: devsecops/creds
      property: MYSQL_USER
