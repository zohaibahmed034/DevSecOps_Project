apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-secrets
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-app-creds
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: devsecops/creds
      # We explicitly tell it to use the 'data' versioning of KV-v2
      metadataPolicy: None
