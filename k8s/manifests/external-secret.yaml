apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-secrets
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-secrets
    creationPolicy: Owner
  data:
    - secretKey: mysql-root-password
      remoteRef:
        key: secret/devsecops/creds
        property: db_root_pass
    - secretKey: mysql-database
      remoteRef:
        key: secret/devsecops/creds
        property: database__connection__database
