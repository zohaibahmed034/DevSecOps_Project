apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-vault-sync
spec:
  refreshInterval: "1m" # Har minute check karega ke password change toh nahi hua
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-secrets # Ye wahi naam hai jo aapne Deployment mein likha hai
    creationPolicy: Owner
  data:
  - secretKey: mysql-root-password
    remoteRef:
      key: devsecops/creds
      property: db_root_pass
  - secretKey: mysql-database
    remoteRef:
      key: devsecops/creds
      property: db_name
  - secretKey: database__connection__password
    remoteRef:
      key: devsecops/creds
      property: db_pass
