apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-vault-sync
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-secrets
    creationPolicy: Owner
  data:
  - secretKey: database__client
    remoteRef:
      key: devsecops/creds
      property: database__client
  - secretKey: database__connection__host
    remoteRef:
      key: devsecops/creds
      property: database__connection__host
  - secretKey: database__connection__user
    remoteRef:
      key: devsecops/creds
      property: database__connection__user
  - secretKey: database__connection__password
    remoteRef:
      key: devsecops/creds
      property: database__connection__password
  - secretKey: database__connection__database
    remoteRef:
      key: devsecops/creds
      property: database__connection__database
  - secretKey: url
    remoteRef:
      key: devsecops/creds
      property: url
