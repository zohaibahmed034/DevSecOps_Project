apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghost-app-secrets
  namespace: default
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghost-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: devsecops/creds # Ab ye direct KV se saare keys utha lega
