apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "ghost-dynamic-role"
        
        # FIX 1: Vault ka asli address aur Port (30853) specify karein
        vault.hashicorp.com/addr: "http://44.195.24.196:30853"
        
        # FIX 2: Kubernetes auth path specify karein (Standard setup mein yahi hota hai)
        vault.hashicorp.com/auth-path: "auth/kubernetes"

        vault.hashicorp.com/agent-inject-secret-config.env: "database/creds/ghost-dynamic-role"
        
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "database/creds/ghost-dynamic-role" -}}
          export database__connection__user="{{ .Data.username }}"
          export database__connection__password="{{ .Data.password }}"
          {{- end -}}
          
        vault.hashicorp.com/agent-restart-on-config-change: "true"
    spec:
      # FIX 3: ServiceAccount lazmi check karein (Default namespace mein 'default' hota hai)
      serviceAccountName: default 
      containers:
      - name: ghost
        image: zuhaibahmed034/ghost-devsecops:v1
        # "source" ki jagah "." use karein jo har shell mein chalta hai
        command: ["sh", "-c", ". /vault/secrets/config.env && node current/index.js"]
        ports:
        - containerPort: 2368
        env:
        - name: database__client
          valueFrom:
            configMapKeyRef:
              name: ghost-config
              key: database__client
        - name: database__connection__host
          valueFrom:
            configMapKeyRef:
              name: ghost-config
              key: database__connection__host
        - name: database__connection__database
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-database
