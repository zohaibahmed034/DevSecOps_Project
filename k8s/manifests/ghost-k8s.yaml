apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      containers:
      - name: ghost
        image: zuhaibahmed034/ghost-devsecops:v1
        ports:
        - containerPort: 2368
        envFrom: # Ye poore group ko utha lega
        - configMapRef:
            name: ghost-config
        - secretRef:
            name: ghost-secrets
