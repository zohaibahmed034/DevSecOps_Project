apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      containers:
      - name: ghost
        image: zuhaibahmed034/ghost-devsecops:v1
        ports:
        - containerPort: 2368
        envFrom:
        - configMapRef:
            name: ghost-config
        - secretRef:
            name: ghost-secrets # <--- Is se ARGO, GITHUB, DB_PASS sab mil jayenge
        env:
        # Ghost specifically looks for this variable name for DB password
        - name: database__connection__password
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-root-password
