apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
      annotations:
        # 1. Vault Agent Sidecar Injection Enable karein
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "ghost-dynamic-role"
        
        # 2. Dynamic credentials ka path aur file name
        vault.hashicorp.com/agent-inject-secret-config.env: "database/creds/ghost-dynamic-role"
        
        # 3. Template: Jo file banaye ga taake Ghost usey load kar sakay
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "database/creds/ghost-dynamic-role" -}}
          export database__connection__user="{{ .Data.username }}"
          export database__connection__password="{{ .Data.password }}"
          {{- end -}}
          
        # 4. Agar 5 min baad password badlay to Pod restart ho jaye
        vault.hashicorp.com/agent-restart-on-config-change: "true"
    spec:
      containers:
      - name: ghost
        image: zuhaibahmed034/ghost-devsecops:v1
        # 5. Command override: Pehle dynamic file load hogi, phir Ghost chalay ga
        command: ["sh", "-c", "source /vault/secrets/config.env && node current/index.js"]
        ports:
        - containerPort: 2368
        env:
        - name: database__client
          valueFrom:
            configMapKeyRef:
              name: ghost-config
              key: database__client
        - name: database__connection__host
          valueFrom:
            configMapKeyRef:
              name: ghost-config
              key: database__connection__host
        - name: database__connection__database
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-database
        # Note: database__connection__user aur password humne upar command mein 'source' kar diye hain
