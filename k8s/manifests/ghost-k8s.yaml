apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      containers:
      - name: ghost
        image: zuhaibahmed034/ghost-devsecops:v1
        ports:
        - containerPort: 2368
        env:
        - name: database__client
          value: "mysql"
        - name: database__connection__host
          value: "db"
        - name: database__connection__user
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: MYSQL_USER
        - name: database__connection__password
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: MYSQL_PASSWORD
        - name: database__connection__database
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: MYSQL_DATABASE
        - name: url
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: url
---
apiVersion: v1
kind: Service
metadata:
  name: ghost-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 2368
      nodePort: 30005
  selector:
    app: ghost
