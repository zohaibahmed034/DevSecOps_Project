apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      containers:
      - name: ghost
        image: zuhaibahmed034/ghost-devsecops:v1
        ports:
        - containerPort: 2368
        env:
        - name: database__client
          value: "mysql"
        - name: database__connection__host
          value: "db" # MySQL Service name
        - name: database__connection__user
          value: "root"
        - name: database__connection__database
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-database
        - name: database__connection__password
          valueFrom:
            secretKeyRef:
              name: ghost-secrets
              key: mysql-root-password
